name: build linux

on:
  workflow_dispatch:

jobs:
  linux-vulkan:
    name: Linux x86_64 (Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install deps (Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools glslc

      - name: Configure (Vulkan)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_CONFIGURATION=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSD_VULKAN=ON

      - name: Build (Vulkan)
        run: |
          cmake --build build --parallel
          cmake --build build --parallel --target sd-server

      - name: Package (Vulkan)
        run: |
          mkdir -p package
          cp build/bin/sd package/
          cp build/bin/sd-server package/
          if ls build/bin/*.spv >/dev/null 2>&1; then cp build/bin/*.spv package/; fi
          if ls build/bin/libstable-diffusion*.so >/dev/null 2>&1; then cp build/bin/libstable-diffusion*.so package/; fi
          tar -czf sd-linux-vulkan.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: sd-linux-vulkan
          path: sd-linux-vulkan.tar.gz

  linux-cuda:
    name: Linux x86_64 (CUDA 12.4)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Install deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ca-certificates build-essential cmake ninja-build libc6-dev
          update-ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show CUDA
        run: nvcc --version || true

      - name: Configure (CUDA)
        env:
          CMAKE_CUDA_ARCHS: "61;75;86;89"
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_CONFIGURATION=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CUDA=ON \
            -DSD_CUDA=ON \
            "-DCMAKE_CUDA_ARCHITECTURES=${CMAKE_CUDA_ARCHS}"

      - name: Build (CUDA)
        run: |
          cmake --build build --parallel
          cmake --build build --parallel --target sd-server

      - name: Package (CUDA)
        run: |
          mkdir -p package
          cp build/bin/sd package/
          cp build/bin/sd-server package/
          if ls build/bin/libstable-diffusion*.so >/dev/null 2>&1; then cp build/bin/libstable-diffusion*.so package/; fi
          tar -czf sd-linux-cuda.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: sd-linux-cuda
          path: sd-linux-cuda.tar.gz
